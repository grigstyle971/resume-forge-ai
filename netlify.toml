[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self' https://api.anthropic.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://bestresumeai.lemonsqueezy.com 'unsafe-inline' 'unsafe-eval'"
